# Релизы по тегам: проверки -> сборка exe -> публикация в релиз -> SLSA-провенанс.
# Пробный запуск: workflow_dispatch (ветка вручную) - пройдут verify и build,
# публикация и провенанс выполняются только на тегах v*.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: проверки перед сборкой
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Сборка решения (0 ошибок - иначе падает)
        run: dotnet build Strofas.slnx -c Release
      - name: Версия совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          ver=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/Strofas/Strofas.csproj | head -1)
          echo "csproj=$ver tag=$GITHUB_REF_NAME"
          test "$ver" = "${GITHUB_REF_NAME#v}"

  build:
    name: сборка Strofas.exe
    needs: verify
    runs-on: windows-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Сборка exe (self-contained, single-file)
        run: dotnet publish src/Strofas -c Release -r win-x64 --self-contained -p:PublishSingleFile=true
      - name: Собранный exe на место
        shell: bash
        run: cp src/Strofas/bin/Release/net10.0-windows/win-x64/publish/Strofas.exe Strofas.exe
      - name: Проверка артефакта
        shell: bash
        # нижняя граница - защита от пустой/обрезанной сборки: собранный
        # локально Strofas.exe весит ~139.8 МБ (2026-11-24: self-contained
        # .NET 10, WPF) - закрепляется нижняя граница, а не размер
        run: python -c "import os; s = os.path.getsize('Strofas.exe'); print('Strofas.exe', s, 'bytes'); assert s > 100_000_000, s"
      - name: Хеш артефакта (формат sha256sum, base64 - для SLSA)
        id: hash
        shell: bash
        run: |
          python -c "import hashlib, base64; h = hashlib.sha256(); f = open('Strofas.exe', 'rb'); [h.update(c) for c in iter(lambda: f.read(1048576), b'')]; open('digests.b64', 'w').write(base64.b64encode((h.hexdigest() + '  Strofas.exe\n').encode()).decode())"
          echo "digests=$(cat digests.b64)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Strofas-exe
          path: Strofas.exe
          if-no-files-found: error
          retention-days: 5

  publish:
    name: публикация exe в релиз
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Strofas-exe
      # Юр-условие «Notices» PolyForm Noncommercial: скачавший exe обязан
      # получить текст лицензии и Required Notice - поэтому LICENSE публикуется
      # отдельным ассетом релиза рядом с бинарником.
      - name: Создать/обновить релиз тега
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Автоматическая сборка (CI). Лицензия: PolyForm Noncommercial License 1.0.0 (ассет LICENSE рядом с exe — выполняется условие «Notices»). Required Notice: Copyright © 2026 vilminessa (https://github.com/vilminessa). Провенанс SLSA прикладывается отдельным джобом (по exe)."
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Strofas.exe LICENSE --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" Strofas.exe LICENSE --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "$notes"
          fi

  generator-generic-ossf-slsa3-publish:
    name: SLSA-провенанс
    needs: [build, publish]
    # на теге ждём успеха публикации, на dispatch публикация пропущена -
    # генерация провенанса всё равно должна пройти (проба конвейера);
    # если сама сборка упала - провенансу обсуждать нечего
    if: always() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      # на теге - в релиз, на dispatch - просто артефакт рана (проба конвейера)
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}

  verify-attestation:
    name: проверка подписи
    needs: generator-generic-ossf-slsa3-publish
    # интота-бандл подписывается в ассеты релиза (upload-assets) - на теге
    # сверяем его с exe; на dispatch ассетов релиза нет - пропускаем
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Скачать exe и провенанс из релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            -p Strofas.exe -p Strofas.exe.intoto.jsonl --clobber
      - name: Юр-пак скачивается из релиза
        env:
          GH_TOKEN: ${{ github.token }}
        # условие «Notices» сверяется по факту: LICENSE должен лежать в релизе
        # рядом с exe, иначе скачавший бинарник текстов условий не получил.
        # Граница снизу - защита от пустого или обрезанного ассета.
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            -p LICENSE --clobber
          python3 -c "import os; s = os.path.getsize('LICENSE'); print('LICENSE', s, 'bytes'); assert s > 4_000, s"
      - name: gh attestation verify (bundle из релиза)
        env:
          GH_TOKEN: ${{ github.token }}
        # бандл - sigstore + provenance v0.2, подписант - reusable workflow
        # генератора: без этих флагов gh ищет v1 в реестре и даёт 404
        run: |
          gh attestation verify Strofas.exe \
            --bundle Strofas.exe.intoto.jsonl \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v0.2 \
            --signer-repo slsa-framework/slsa-github-generator
